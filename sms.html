<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Open in Phone Link</title>
<style>body{font:16px system-ui,sans-serif;margin:40px 16px;color:#222}</style>
<p>Opening Phone Link… <a id="go" href="#">Click here</a> if nothing happens.</p>
<script>
  // Link format: sms.html#<number>  or  sms.html#<number>?body=<url-encoded message>
  // Everything after the # stays in your browser (never sent to the host).
  var h = location.hash.slice(1);
  var i = h.indexOf('?');
  var n = decodeURIComponent(i < 0 ? h : h.slice(0, i)).replace(/[^\d+]/g, '');
  var extra = i < 0 ? '' : h.slice(i); // e.g. ?body=Hello%2C%20there
  if (n) {
    if (n.charAt(0) !== '+') n = '+' + (n.length === 10 ? '1' + n : n); // 10 digits = US number
    var link = 'sms:' + n + extra;
    document.getElementById('go').href = link;
    location.href = link;
  } else {
    document.body.textContent = 'No phone number in the link.';
  }
</script>
